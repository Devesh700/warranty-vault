name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ENV_FILE
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create .env file
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
          RC_IOS_KEY: ${{ secrets.RC_IOS_KEY }}
        run: |
          printf "FIREBASE_API_KEY=%s\n" "$FIREBASE_API_KEY" > .env
          printf "FIREBASE_AUTH_DOMAIN=%s\n" "$FIREBASE_AUTH_DOMAIN" >> .env
          printf "FIREBASE_PROJECT_ID=%s\n" "$FIREBASE_PROJECT_ID" >> .env
          printf "FIREBASE_STORAGE_BUCKET=%s\n" "$FIREBASE_STORAGE_BUCKET" >> .env
          printf "FIREBASE_MESSAGING_SENDER_ID=%s\n" "$FIREBASE_MESSAGING_SENDER_ID" >> .env
          printf "FIREBASE_APP_ID=%s\n" "$FIREBASE_APP_ID" >> .env
          printf "FIREBASE_MEASUREMENT_ID=%s\n" "$FIREBASE_MEASUREMENT_ID" >> .env
          printf "FIREBASE_VAPID_KEY=%s\n" "$FIREBASE_VAPID_KEY" >> .env
          printf "FIREBASE_ANDROID_APP_ID=%s\n" "$FIREBASE_ANDROID_APP_ID" >> .env
          printf "FIREBASE_IOS_APP_ID=%s\n" "$FIREBASE_IOS_APP_ID" >> .env
          printf "RC_ANDROID_KEY=%s\n" "$RC_ANDROID_KEY" >> .env
          printf "RC_IOS_KEY=%s\n" "$RC_IOS_KEY" >> .env
          mkdir -p assets
          cp .env assets/env
      - name: Verify .env configuration
        run: |
          echo "Verifying .env file presence and keys:"
          ls -la .env
          ls -la assets/env
          grep -v '^#' .env | awk -F'=' '{if ($2 != "") print $1 "= [CONFIGURED]"; else print $1 "= [EMPTY]"}'
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=.env
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
